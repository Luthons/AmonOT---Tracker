name: Atualizar Dados Completo

on:
  schedule:
    - cron: '*/30 * * * *'  # A cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Rodar scraper completo (com fetch_chars)
        env:
          FETCH_CHARS: "true"
        run: python main.py

      - name: Salvar arquivos no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guild_data.json market_snapshot.json death_snapshot.json
          git diff --cached --quiet || git commit -m "chore: atualizar dados completo [skip vercel] [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
