name: Atualizar Dados da Guild

on:
  schedule:
    - cron: '0 * * * *'  # A cada hora
  workflow_dispatch:       # Permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Restaurar guild_data.json anterior
        uses: actions/cache@v4
        with:
          path: guild_data.json
          key: guild-data-${{ github.run_id }}
          restore-keys: |
            guild-data-

      - name: Rodar scraper
        run: python main.py

      - name: Rodar market tracker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python market_tracker.py

      - name: Rodar death tracker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python death_tracker.py

      - name: Salvar arquivos no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guild_data.json market_snapshot.json death_snapshot.json
          git diff --cached --quiet || git commit -m "chore: atualizar dados [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push

      - name: Deploy no Vercel (só se index.html mudou)
        run: |
          if git diff HEAD^ HEAD --name-only | grep -q "index.html"; then
            curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_QILaxpNGzjDLuUQRR2jKQHM8o7Sz/47NPwowmva"
            echo "Deploy Vercel disparado."
          else
            echo "index.html não mudou, deploy Vercel ignorado."
          fi
